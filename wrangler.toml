name = "epub-spell-check"
compatibility_date = "2024-09-23"
pages_build_output_dir = "dist"

# Used by `wrangler pages dev` for local testing of /functions.
# Replace the id below with the id printed by:
#   npx wrangler kv namespace create DICT_KV
[[kv_namespaces]]
binding = "DICT_KV"
id = "ab6a4a72cbf2462f8d8b1074e44db5e7"

# ADMIN_TOKEN is a secret, not stored here. For local dev, run:
#   npx wrangler pages dev dist --kv DICT_KV --binding ADMIN_TOKEN=your-local-token
# For production, set it in the Cloudflare dashboard:
#   Pages project -> Settings -> Environment variables -> Add secret -> ADMIN_TOKEN
